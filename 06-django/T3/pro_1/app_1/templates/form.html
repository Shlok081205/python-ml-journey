<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form method="GET" action="{% url 'show_data' %}"
      style="
        max-width: 450px;
        margin: 30px auto;
        padding: 25px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-family: &quot;Segoe UI&quot;, Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ffffff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      "
    >
      <h2
        style="
          text-align: center;
          color: #2c3e50;
          margin-top: 0;
          margin-bottom: 20px;
        "
      >
        Contact Us
      </h2>

      <div style="margin-bottom: 15px">
        <label
          for="name"
          style="
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
          "
          >Full Name</label
        >
        <input
          type="text"
          id="name"
          name="name"
          placeholder="John Doe"
          required
          style="
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
          "
        />
      </div>

      <div style="margin-bottom: 15px">
        <label
          for="email"
          style="
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
          "
          >Email Address</label
        >
        <input
          type="email"
          id="email"
          name="email"
          placeholder="john@example.com"
          required
          style="
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
          "
        />
      </div>

      <div style="margin-bottom: 15px">
        <label
          for="inquiry-type"
          style="
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
          "
          >Inquiry Type</label
        >
        <select
          id="inquiry-type"
          name="inquiry-type"
          style="
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            background-color: white;
            outline: none;
          "
        >
          <option value="general">General Question</option>
          <option value="support">Technical Support</option>
          <option value="billing">Billing Issue</option>
        </select>
      </div>

      <div style="margin-bottom: 20px">
        <label
          style="
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
          "
          >Priority Level</label
        >
        <div style="display: flex; gap: 15px">
          <label
            style="
              font-size: 14px;
              color: #475569;
              display: flex;
              align-items: center;
              cursor: pointer;
            "
          >
            <input
              type="radio"
              name="priority"
              value="normal"
              checked
              style="margin-right: 6px"
            />
            Normal
          </label>
          <label
            style="
              font-size: 14px;
              color: #475569;
              display: flex;
              align-items: center;
              cursor: pointer;
            "
          >
            <input
              type="radio"
              name="priority"
              value="urgent"
              style="margin-right: 6px"
            />
            Urgent
          </label>
        </div>
      </div>

      <div style="margin-bottom: 25px">
        <label
          style="
            font-size: 14px;
            color: #475569;
            display: flex;
            align-items: center;
            cursor: pointer;
          "
        >
          <input type="checkbox" name="newsletter" style="margin-right: 8px" />
          Subscribe to our weekly newsletter
        </label>
      </div>

      <div style="text-align: center">
        <button
          type="submit"
          style="
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s;
          "
        >
          Send Message
        </button>
      </div>
    </>
  </body>
</html>
