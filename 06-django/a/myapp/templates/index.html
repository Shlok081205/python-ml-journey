<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthwave Portal</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0c0014;
      background-image: linear-gradient(180deg, #0c0014 0%, #19012a 100%);
      color: #ff007f;
      font-family: &quot;Segoe UI&quot;, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    "
  >
    <!-- Background Grid Effect -->
    <div
      style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(transparent 97%, rgba(255, 0, 127, 0.1) 97%),
          linear-gradient(90deg, transparent 97%, rgba(255, 0, 127, 0.1) 97%);
        background-size: 30px 30px;
        pointer-events: none;
        z-index: 1;
      "
    ></div>

    <!-- Main Container -->
    <main
      style="
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 450px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        padding: 2.5rem;
        background: rgba(12, 0, 20, 0.7);
        border: 2px solid #390099;
        box-shadow: 0 0 25px rgba(57, 0, 153, 0.6);
        border-radius: 8px;
        backdrop-filter: blur(4px);
      "
    >
      <!-- Link 1 -->
      <a
        href="/eng"
        style="
          display: block;
          padding: 1.2rem;
          text-decoration: none;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 2px;
          font-size: clamp(0.9rem, 2.5vw, 1.1rem);
          color: #00f0ff;
          border: 2px solid #00f0ff;
          background: transparent;
          border-radius: 4px;
          text-shadow: 0 0 8px #00f0ff;
          box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
          transition: all 0.3s ease;
        "
      >
        English
      </a>

      <!-- Link 2 -->
      <a
        href="/jap"
        style="
          display: block;
          padding: 1.2rem;
          text-decoration: none;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 2px;
          font-size: clamp(0.9rem, 2.5vw, 1.1rem);
          color: #ff007f;
          border: 2px solid #ff007f;
          background: transparent;
          border-radius: 4px;
          text-shadow: 0 0 8px #ff007f;
          box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
          transition: all 0.3s ease;
        "
      >
        Japenese
      </a>

      <!-- Link 3 -->
      <a
        href="/"
        style="
          display: block;
          padding: 1.2rem;
          text-decoration: none;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 2px;
          font-size: clamp(0.9rem, 2.5vw, 1.1rem);
          color: #ff9e00;
          border: 2px solid #ff9e00;
          background: transparent;
          border-radius: 4px;
          text-shadow: 0 0 8px #ff9e00;
          box-shadow: 0 0 10px rgba(255, 158, 0, 0.2);
          transition: all 0.3s ease;
        "
      >
        Home
      </a>
    </main>
  </body>
</html>
