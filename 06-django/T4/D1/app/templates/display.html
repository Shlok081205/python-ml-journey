<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Database Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table { 
            width: 80%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 10px; 
            text-align: left; 
        }
        th { 
            background-color: #f4f4f4; 
        }
        .add-btn {
            display: inline-block; 
            margin-bottom: 15px; 
            padding: 10px 15px; 
            background-color: #4CAF50; 
            color: white; 
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .add-btn:hover {
            background-color: #45a049;
        }
        .action-link {
            text-decoration: none;
            margin-right: 10px;
        }
        .delete-link {
            color: red;
        }
    </style>
</head>
<body>
    <h1>All Database Records</h1>

    <a href="{% url 'add_data' %}" class="add-btn">+ Add New Record</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Enrollment (enr)</th>
                <th>Class (cl)</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for item in data %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.enr }}</td>
                <td>{{ item.cl }}</td>
                <td>{{ item.name }}</td>
                <td>
                    <a href="{% url 'edit_data' item.id %}" class="action-link">Edit</a> | 
                    <a href="{% url 'delete_data' item.id %}" class="action-link delete-link" onclick="return confirm('Are you sure you want to delete this record?');">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" style="text-align: center;">No records found in the database. Try adding one!</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
