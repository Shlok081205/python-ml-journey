<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Record</title>
</head>
<body>
    <h1>Edit Record #{{ item.id }}</h1>

    <form method="POST">
        {% csrf_token %} 
        
        <label>Enrollment (enr):</label><br>
        <input type="text" name="enr" value="{{ item.enr }}"><br><br>

        <label>Class (cl):</label><br>
        <input type="number" name="cl" value="{{ item.cl }}"><br><br>

        <label>Name:</label><br>
        <input type="text" name="name" value="{{ item.name }}"><br><br>

        <button type="submit">Save Changes</button>
    </form>
    
    <br>
    <a href="{% url 'display_data' %}">Cancel and go back</a>

</body>
</html>
