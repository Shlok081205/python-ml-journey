<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Record</title>
</head>
<body>
    <h1>Add New Record</h1>

    <form method="POST">
        {% csrf_token %} 
        
        <label>Enrollment (enr):</label><br>
        <input type="text" name="enr" required><br><br>

        <label>Class (cl):</label><br>
        <input type="number" name="cl" required><br><br>

        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <button type="submit">Add Record</button>
    </form>
    
    <br>
    <a href="{% url 'display_data' %}">Cancel and go back</a>

</body>
</html>
