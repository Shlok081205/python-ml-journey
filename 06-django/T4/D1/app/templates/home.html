<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Database Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .enter-btn {
            display: inline-block; 
            padding: 15px 30px; 
            background-color: #008CBA; 
            color: white; 
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .enter-btn:hover {
            background-color: #007B9E;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Student Database</h1>
        <p>A simple portal to manage enrollments and classes.</p>
        
        <a href="{% url 'display_data' %}" class="enter-btn">View Database Records</a>
    </div>

</body>
</html>
